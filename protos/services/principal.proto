syntax = "proto3";

package services;

import "identity/principal.proto";
import "token/grant.proto";

option go_package = "github.com/authaas/api/services";

// PrincipalService handles principal management operations
service PrincipalService {
  // Delete principal
  rpc DeletePrincipal(DeletePrincipalRequest) returns (DeletePrincipalResponse);

  // Retrieve a grant
  rpc GetGrantHash(GetGrantHashRequest) returns (GetGrantHashResponse);

  // Consume a grant
  rpc ClearGrant(ClearGrantRequest) returns (ClearGrantResponse);
}

// Delete principal
message DeletePrincipalRequest {
  identity.Principal principal = 1;
}

message DeletePrincipalResponse {}

message GetGrantHashRequest {
  identity.Principal principal = 1;
}

message GetGrantHashResponse {
  // SHA-256 digest; unset when no grant is issued
  optional bytes grant_hash = 1;
}

message ClearGrantRequest {
  identity.Principal principal = 1;
  token.Grant grant = 2;
}

message ClearGrantResponse {}
