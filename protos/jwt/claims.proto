syntax = "proto3";

package jwt;

option go_package = "git.sonicoriginal.software/grpc-auth;authapi";

// Claims represents JWT claims for encoding
message Claims {
  // Subject (JWT "sub") - the principal_id this credential represents
  string sub = 1;

  // Audience (JWT "aud") - the intended recipient/resource server(s)
  repeated string aud = 2;

  // Issuer (JWT "iss") - who issued this token
  string iss = 3;

  // Expiration time (JWT "exp") - Unix timestamp (0 = never expires)
  int64 exp = 4;

  // Issued at (JWT "iat") - Unix timestamp
  int64 iat = 5;

  // Not before (JWT "nbf") - Unix timestamp
  int64 nbf = 6;

  // JWT ID (JWT "jti") - unique identifier for this credential
  string jti = 7;
}
